    Industry Collaborations:
      - company: Réseau de Transport d'Électricité (RTE), France
        position: TS4PS project (PSERC)
        highlights:
          - Led the reconstruction of multi-year, 5-minute nodal active-power injection time series for the RTE7000 French transmission grid (~7,000 buses) by capacity-proportional disaggregation of public regional data (eco2mix, ENTSO-E).
          - Released the open-source pipeline on GitHub (AI4OPT/TS4PS-RTE7000) and the dataset (~12.8B rows, 2021–2023) on Hugging Face (OpenSynth/rte7000).

      - company: U.S. Vertically Integrated Utility
        position: Solar fleet forecasting
        highlights:
          - Developed a calibrated probabilistic aggregation framework that turns site-level solar forecasts from heterogeneous third-party providers into reliable fleet-level forecasts.
          - Combined copula-based modeling of cross-site dependence with context-aware conformal prediction (CACP), reaching near-nominal coverage with significantly sharper intervals than uncalibrated aggregation.

